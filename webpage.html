<!--<!doctype html>
<html lang="en">S
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Growing-Season Risk Report</title>
  <style>
    :root {
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #23332b;
      background: #99ae95;
      font-synthesis: none;
      --ink: #23332b;
      --muted: #68776d;
      --line: #dce3d8;
      --green: #2f704e;
      --green-dark: #1d5138;
      --green-light: #e7f2e7;
      --panel: #fffefa;
      --gold-light: #fff4d9;
      --red-light: #fff0e9;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: radial-gradient(ellipse at 93% 0%, rgb(183 212 166 / 32%), transparent 34rem), #f5f5ee;
    }
    main { width: min(1200px, calc(100% - 40px)); margin: 0 auto; padding: 38px 0 58px; }
    .eyebrow { color: var(--green); font-size: .73rem; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 8px 0 9px; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.07; letter-spacing: -.05em; }
    .intro { max-width: 760px; margin: 0; color: var(--muted); line-height: 1.65; }
    .hero { display: flex; justify-content: space-between; align-items: end; gap: 24px; }
    .hero-mark { flex: 0 0 auto; display: grid; width: 68px; height: 68px; place-items: center; border: 1px solid #d5e4d1; border-radius: 21px; background: var(--green-light); color: var(--green-dark); font-size: 1.9rem; }
    .card { border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 14px 40px rgb(34 56 39 / 6%); }
    .card-head { padding: 19px 21px 15px; border-bottom: 1px solid var(--line); }
    .card-head h2 { margin: 0; font-size: 1rem; letter-spacing: -.02em; }
    .card-head p { margin: 6px 0 0; color: var(--muted); font-size: .83rem; line-height: 1.55; }
    .form-card { margin-top: 24px; }
    form { padding: 18px 21px 20px; }
    .form-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; align-items: end; }
    .field { min-width: 0; }
    .field label { display: block; margin-bottom: 7px; color: #384b3e; font-size: .77rem; font-weight: 730; }
    input, select {
      width: 100%; height: 42px; border: 1px solid #cbd6c9; border-radius: 9px; outline: none;
      background: #fff; color: var(--ink); font-family: "Times", "Times New Roman", "Georgia", serif; font-size: .85rem;
    }
    input { padding: 0 10px; }
    select { padding: 0 25px 0 10px; }
    input:focus, select:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgb(47 112 78 / 12%); }
    .lat, .lon, .season, .start, .end, .threshold { grid-column: span 1; }
    .actions { grid-column: span 2; }
    .hint { margin: 6px 0 0; color: var(--muted); font-size: .71rem; line-height: 1.45; }
    .submit { width: 100%; min-height: 42px; border: 0; border-radius: 9px; background: var(--green); color: white; cursor: pointer; font: inherit; font-size: .83rem; font-weight: 760; transition: background .15s, transform .15s; }
    .submit:hover { background: var(--green-dark); }
    .submit:active { transform: translateY(1px); }
    .submit:disabled { cursor: progress; opacity: .7; }
    .form-note { margin: 12px 0 0; color: var(--muted); font-size: .72rem; line-height: 1.55; }
    .notice { margin: 12px 0 0; padding: 11px 12px; border: 1px solid #e8d8ae; border-radius: 9px; background: var(--gold-light); color: #69501f; font-size: .74rem; line-height: 1.55; }
    .error { display: none; margin: 12px 0 0; padding: 10px 12px; border: 1px solid #e8bcb0; border-radius: 9px; background: var(--red-light); color: #843e2b; font-size: .8rem; line-height: 1.5; }
    .error.visible { display: block; }
    .section { margin-top: 21px; }
    .section-head { display: flex; justify-content: space-between; align-items: start; gap: 16px; margin-bottom: 11px; }
    .section-head h2 { margin: 0; font-size: 1.1rem; letter-spacing: -.025em; }
    .section-head p { margin: 5px 0 0; color: var(--muted); font-size: .8rem; line-height: 1.5; }
    .tag { flex: 0 0 auto; display: inline-block; padding: 6px 9px; border-radius: 99px; background: var(--green-light); color: var(--green-dark); font-size: .7rem; font-weight: 750; }
    .tag.pending { background: #f0f1ed; color: #68776d; }
    .tag.warning { background: var(--gold-light); color: #805c1e; }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .metric { min-height: 103px; padding: 14px 14px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
    .metric-name { color: var(--muted); font-size: .7rem; line-height: 1.4; }
    .metric-value { margin-top: 8px; color: var(--green-dark); font-size: 1.38rem; font-weight: 780; letter-spacing: -.04em; }
    .metric-detail { margin-top: 4px; color: #829087; font-size: .67rem; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .chart-card { min-width: 0; padding: 16px 17px 12px; border: 1px solid var(--line); border-radius: 13px; background: var(--panel); }
    .chart-card h3 { margin: 0; font-size: .86rem; }
    .chart-card p { margin: 5px 0 0; color: var(--muted); font-size: .7rem; }
    canvas { display: block; width: 100%; height: 205px; margin-top: 7px; }
    .chart-legend { display: flex; flex-wrap: wrap; gap: 7px 14px; color: var(--muted); font-size: .68rem; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; }
    .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 3px; }
    .two-panels { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 1fr); gap: 15px; align-items: start; }
    .crop-card { padding: 15px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); margin-top: 10px; }
    .reason { margin: 0; color: #526457; font-size: .78rem; line-height: 1.6; }
    .side-stack { display: grid; gap: 12px; }
    .pending-card { padding: 16px; border: 1px dashed #cbd6c9; border-radius: 12px; background: #fafbf7; }
    .pending-card.live { border-style: solid; border-color: var(--line); background: var(--panel); }
    .pending-card h3 { margin: 6px 0 0; font-size: .88rem; }
    .pending-card p { margin: 7px 0 0; color: var(--muted); font-size: .75rem; line-height: 1.55; }
    .soil-table-wrap { margin-top: 10px; overflow-x: auto; }
    .soil-table { width: 100%; border-collapse: collapse; font-size: .68rem; }
    .soil-table th, .soil-table td { padding: 5px 6px; border-bottom: 1px solid #edf0e9; text-align: right; white-space: nowrap; }
    .soil-table th:first-child, .soil-table td:first-child { text-align: left; }
    .soil-table th { color: var(--muted); font-weight: 700; }
    .soil-table td { color: #34473a; }
    .source { margin: 13px 2px 0; color: #76847a; font-size: .7rem; line-height: 1.55; }
    .source a { color: var(--green-dark); }
    .empty { padding: 32px 18px; border: 1px dashed #d1dbcf; border-radius: 12px; background: var(--panel); color: var(--muted); text-align: center; font-size: .83rem; line-height: 1.6; }
    footer { margin-top: 24px; color: #758278; font-size: .72rem; line-height: 1.6; }
    @media (max-width: 900px) { .form-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } .actions { grid-column: span 2; } .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 650px) {
      main { width: min(100% - 26px, 560px); padding-top: 28px; }
      .hero-mark { display: none; }
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .lat, .lon, .season, .start, .end, .threshold { grid-column: span 1; }
      .actions { grid-column: span 2; }
      .charts, .two-panels { grid-template-columns: 1fr; }
    }
    @media (max-width: 390px) { .metric-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .section-head { flex-direction: column; } }
  </style>
</head>
<body>
<main>
  <header class="hero">
    <div>
      <div class="eyebrow">NASA Earth Data · USDA Soil Data · Farm Planning</div>
      <h1>Growing-Season Risk Report</h1>
      <p class="intro">Understand the environmental conditions your farm has experienced. Explore historical temperature, rainfall, and soil information to identify patterns and potential growing-season concerns. We provide environmental insights so farmers can make informed decisions.</p>
    </div>
    <div class="hero-mark" aria-hidden="true">✳</div>
  </header>

  <section class="card form-card" aria-labelledby="conditions-title">
    <div class="card-head">
      <h2 id="conditions-title">Farm Location & Growing Window</h2>
      <p>Enter the coordinates for your farm and select the historical period you want to examine.</p>
    </div>
    <form id="planner-form">
      <div class="form-grid">
        <div class="field lat">
          <label for="latitude">Latitude</label>
          <input id="latitude" type="number" min="-90" max="90" step="any" placeholder="E.g. 36.7378" required>
        </div>
        <div class="field lon">
          <label for="longitude">Longitude</label>
          <input id="longitude" type="number" min="-180" max="180" step="any" placeholder="E.g. -119.7871" required>
        </div>
        <div class="field season">
          <label for="season">Growing season</label>
          <select id="season" required>
            <option value="">Select season</option>
            <option value="winter">Winter</option>
            <option value="spring">Spring</option>
            <option value="summer">Summer</option>
            <option value="fall">Fall</option>
          </select>
        </div>
        <div class="field start">
          <label for="start-date">Start date</label>
          <input id="start-date" type="date" min="1981-01-01" required>
        </div>
        <div class="field end">
          <label for="end-date">End date</label>
          <input id="end-date" type="date" required>
        </div>
        <div class="field threshold">
          <label for="heat-threshold">Heat threshold (°C)</label>
          <input id="heat-threshold" type="number" value="35" step="1" required>
          <p class="hint">Flag daily highs above this value.</p>
        </div>
        <div class="field threshold">
          <label for="cold-threshold">Cold threshold (°C)</label>
          <input id="cold-threshold" type="number" value="0" step="1" required>
          <p class="hint">Flag daily lows below this value.</p>
        </div>
        <div class="field actions">
          <button class="submit" id="submit-button" type="submit">Generate Growing-Season Report</button>
        </div>
      </div>
      <p class="form-note">Choose a date range of up to 365 days. NASA POWER daily data begins on 1981-01-01. Dates cannot be in the future, and very recent dates may not be available yet.</p>
      <p class="notice"><strong>Important:</strong> Temperature thresholds are user-selected screening values, not universal crop-damage limits. Historical weather does not predict next year's conditions or guarantee crop performance.</p>
      <div class="error" id="error-message" role="alert"></div>
    </form>
  </section>

  <section class="section" aria-labelledby="weather-title">
    <div class="section-head">
      <div>
        <h2 id="weather-title">Weather Conditions</h2>
        <p id="weather-description">NASA POWER measurements will appear after you generate a report.</p>
      </div>
      <span class="tag pending" id="weather-status">Waiting for location</span>
    </div>
    <div class="metric-grid" id="metrics" aria-live="polite">
      <div class="metric"><div class="metric-name">Mean air temperature</div><div class="metric-value">—</div><div class="metric-detail">NASA POWER · T2M</div></div>
      <div class="metric"><div class="metric-name">Average daily high</div><div class="metric-value">—</div><div class="metric-detail">NASA POWER · T2M_MAX</div></div>
      <div class="metric"><div class="metric-name">Average daily low</div><div class="metric-value">—</div><div class="metric-detail">NASA POWER · T2M_MIN</div></div>
      <div class="metric"><div class="metric-name">Accumulated precipitation</div><div class="metric-value">—</div><div class="metric-detail">NASA POWER · PRECTOTCORR</div></div>
      <div class="metric"><div class="metric-name">Daily solar energy</div><div class="metric-value">—</div><div class="metric-detail">NASA POWER · ALLSKY_SFC_SW_DWN</div></div>
      <div class="metric"><div class="metric-name">Mean relative humidity</div><div class="metric-value">—</div><div class="metric-detail">NASA POWER · RH2M</div></div>
      <div class="metric"><div class="metric-name">Surface soil wetness (modeled)</div><div class="metric-value">—</div><div class="metric-detail">NASA POWER · GWETTOP</div></div>
      <div class="metric"><div class="metric-name">Root-zone soil wetness (modeled)</div><div class="metric-value">—</div><div class="metric-detail">NASA POWER · GWETROOT</div></div>
    </div>
    <p class="source" id="source-note">No measurements have been fetched yet.</p>
  </section>

  <section class="section" aria-labelledby="chart-section-title">
    <div class="section-head">
      <div>
        <h2 id="chart-section-title">Historical Weather Trends</h2>
        <p>Daily observations for the selected location and date range.</p>
      </div>
    </div>
    <div class="charts">
      <article class="chart-card">
        <h3>Daily air temperature</h3>
        <p>Daily mean, maximum, and minimum (°C)</p>
        <canvas id="temperature-chart" aria-label="NASA POWER daily temperature chart"></canvas>
        <div class="chart-legend">
          <span class="legend-item"><i class="swatch" style="background:#000000"></i>Mean</span>
          <span class="legend-item"><i class="swatch" style="background:#3ea26e"></i>Maximum</span>
          <span class="legend-item"><i class="swatch" style="background:#ecd856"></i>Minimum</span>
        </div>
      </article>
      <article class="chart-card">
        <h3>Daily precipitation</h3>
        <p>Corrected precipitation (mm/day)</p>
        <canvas id="precipitation-chart" aria-label="NASA POWER daily precipitation chart"></canvas>
        <div class="chart-legend"><span class="legend-item"><i class="swatch" style="background:#255b82"></i>PRECTOTCORR</span></div>
      </article>
    </div>
  </section>

  <section class="section" aria-labelledby="risk-title">
    <div class="section-head">
      <div>
        <h2 id="risk-title">Growing-Season Risk Report</h2>
        <p>Review historical weather patterns and potential environmental concerns for this location.</p>
      </div>
      <span class="tag pending" id="risk-status">Waiting for data</span>
    </div>
    <div class="metric-grid" id="risk-metrics">
      <div class="metric"><div class="metric-name">Days above heat threshold</div><div class="metric-value">—</div><div class="metric-detail">Daily maximum temperature</div></div>
      <div class="metric"><div class="metric-name">Days below cold threshold</div><div class="metric-value">—</div><div class="metric-detail">Daily minimum temperature</div></div>
      <div class="metric"><div class="metric-name">Longest dry stretch</div><div class="metric-value">—</div><div class="metric-detail">Consecutive days below 1 mm precipitation</div></div>
      <div class="metric"><div class="metric-name">Total precipitation</div><div class="metric-value">—</div><div class="metric-detail">Accumulated over selected period</div></div>
    </div>
    <div class="candidate-list" id="risk-findings" style="margin-top:12px">
      <div class="empty">Environmental findings will appear here after you generate a report.</div>
    </div>
  </section>

  <section class="section two-panels" aria-label="Additional environmental information">
    <aside class="side-stack">
      <article class="pending-card" id="moisture-card">
        <span class="tag pending" id="moisture-tag">Waiting for data</span>
        <h3>Modeled soil moisture</h3>
        <div id="moisture-body"><p>NASA POWER modeled surface and root-zone soil wetness will appear here.</p></div>
      </article>
      <article class="pending-card" id="usda-card">
        <span class="tag pending" id="usda-tag">Waiting for data</span>
        <h3>USDA soil characteristics</h3>
        <div id="usda-body"><p>Soil texture, organic matter, pH, and available water capacity will appear here when available.</p></div>
      </article>
    </aside>
    <aside class="side-stack">
      <article class="pending-card">
        <span class="tag warning">Planning context</span>
        <h3>How to use this report</h3>
        <p>Use these findings to identify questions for your next growing season. Compare the results with field observations, irrigation records, crop growth stages, and local agricultural extension guidance.</p>
      </article>
      <article class="pending-card">
        <span class="tag pending">Not yet included</span>
        <h3>Historical baseline comparison</h3>
        <p>This first version summarizes the selected period. It does not yet compare that period with a multi-year climate baseline or predict future weather.</p>
      </article>
    </aside>
  </section>

  <footer>
    NASA POWER climate data represents estimates for a geographic coordinate, not direct field sensor readings. Soil wetness values are modeled using MERRA-2 and are not SMAP satellite measurements. USDA soil information represents soil survey estimates for a map unit, not measurements of a specific field. Rainfall is not equivalent to irrigation or total water available to crops. Temperature thresholds are user-selected screening values, not universal crop-damage thresholds. Historical conditions do not predict future weather, crop yields, or planting success. Farmers should consult local agricultural extension resources and field measurements when making decisions.
  </footer>
</main>

<script>
  const parameterLabels = [
    ["T2M", "Mean air temperature", "°C"],
    ["T2M_MAX", "Average daily high", "°C"],
    ["T2M_MIN", "Average daily low", "°C"],
    ["PRECTOTCORR", "Accumulated precipitation", "mm"],
    ["ALLSKY_SFC_SW_DWN", "Daily solar energy", "kWh/m²/day"],
    ["RH2M", "Mean relative humidity", "%"],
    ["GWETTOP", "Surface soil wetness (modeled)", ""],
    ["GWETROOT", "Root-zone soil wetness (modeled)", ""]
  ];

  const form = document.querySelector("#planner-form");
  const riskFindings = document.querySelector("#risk-findings");
  const errorOutput = document.querySelector("#error-message");
  const submitButton = document.querySelector("#submit-button");
  let lastDailyData = [];

  const todayUtc = new Date().toISOString().slice(0, 10);
  document.querySelector("#start-date").max = todayUtc;
  document.querySelector("#end-date").max = todayUtc;

  function renderMetrics(summary) {
    const container = document.querySelector("#metrics");
    container.replaceChildren();
    for (const [parameter, label, displayUnit] of parameterLabels) {
      const datum = summary[parameter];
      const card = document.createElement("article");
      card.className = "metric";
      const name = document.createElement("div");
      name.className = "metric-name";
      name.textContent = label;
      const value = document.createElement("div");
      value.className = "metric-value";
      if (!datum || datum.value === null || datum.value === undefined) {
        value.textContent = "N/A";
      } else {
        const digits = parameter === "RH2M" ? 1 : parameter.startsWith("GWET") ? 3 : 2;
        value.textContent = `${Number(datum.value).toFixed(digits)} ${displayUnit}`.trim();
      }
      const detail = document.createElement("div");
      detail.className = "metric-detail";
      detail.textContent = datum
        ? `${datum.days_available} valid day${datum.days_available === 1 ? "" : "s"} · ${parameter}`
        : `${parameter} · no data`;
      card.append(name, value, detail);
      container.append(card);
    }
  }

  function para(text) {
    const p = document.createElement("p");
    p.textContent = text;
    return p;
  }

  function setCard(prefix, tagText, tagClass, nodes) {
    const tag = document.querySelector(`#${prefix}-tag`);
    tag.textContent = tagText;
    tag.className = `tag ${tagClass}`.trim();
    document.querySelector(`#${prefix}-card`).classList.toggle("live", tagClass === "");
    document.querySelector(`#${prefix}-body`).replaceChildren(...nodes);
  }

  function renderSoilMoisture(summary) {
    const top = summary.GWETTOP;
    const root = summary.GWETROOT;
    const has = datum => datum && datum.value !== null && datum.value !== undefined;
    if (!has(top) && !has(root)) {
      setCard("moisture", "Unavailable", "warning", [para("NASA POWER returned no soil wetness values for this request.")]);
      return;
    }
    const show = datum => has(datum) ? Number(datum.value).toFixed(3) : "N/A";
    setCard("moisture", "Modeled · not SMAP", "", [
      para(`Surface soil wetness: ${show(top)} · Root zone: ${show(root)}`),
      para("Period averages on a 0–1 scale. These are NASA POWER model estimates (MERRA-2), not SMAP satellite measurements.")
    ]);
  }

  function formatNumber(value, digits) {
    if (value === null || value === undefined || value === "") return "—";
    const number = Number(value);
    return Number.isFinite(number) ? number.toFixed(digits) : "—";
  }

  function renderUsdaSoil(data) {
    if (!data.horizons || !data.horizons.length) {
      setCard("usda", "Unavailable", "warning", [para("No USDA soil horizon information was returned for this point.")]);
      return;
    }
    const groups = new Map();
    for (const horizon of data.horizons) {
      const key = `${horizon.compname}|${horizon.comppct_r}`;
      if (!groups.has(key)) groups.set(key, { name: horizon.compname, pct: horizon.comppct_r, rows: [] });
      groups.get(key).rows.push(horizon);
    }
    const components = [...groups.values()];
    const main = components[0];
    const table = document.createElement("table");
    table.className = "soil-table";
    const head = table.createTHead().insertRow();
    for (const heading of ["Depth (cm)", "Sand %", "Silt %", "Clay %", "pH", "OM %", "AWC"]) {
      const th = document.createElement("th");
      th.textContent = heading;
      head.append(th);
    }
    const bodyEl = table.createTBody();
    for (const row of main.rows) {
      const sand = row.sandtotal_r === null || row.sandtotal_r === "" ? null : Number(row.sandtotal_r);
      const clay = row.claytotal_r === null || row.claytotal_r === "" ? null : Number(row.claytotal_r);
      const silt = Number.isFinite(sand) && Number.isFinite(clay) ? 100 - sand - clay : null;
      const cells = [
        `${formatNumber(row.hzdept_r, 0)}–${formatNumber(row.hzdepb_r, 0)}`,
        formatNumber(sand, 0), formatNumber(silt, 0), formatNumber(clay, 0),
        formatNumber(row.ph1to1h2o_r, 1), formatNumber(row.om_r, 1), formatNumber(row.awc_r, 2)
      ];
      const tr = bodyEl.insertRow();
      for (const cellText of cells) tr.insertCell().textContent = cellText;
    }
    const wrap = document.createElement("div");
    wrap.className = "soil-table-wrap";
    wrap.append(table);
    const nodes = [
      para(`Dominant soil component: ${main.name} (${main.pct}% of the map unit).`),
      wrap
    ];
    const others = components.slice(1).map(item => `${item.name} (${item.pct}%)`);
    if (others.length) nodes.push(para(`Other major components: ${others.join(", ")}.`));
    nodes.push(para("OM = organic matter; AWC = available water capacity. USDA soil survey estimates for the map unit at this point, not measurements of your field. No N-P-K levels are provided."));
    setCard("usda", "USDA soil survey", "", nodes);
  }

  async function loadSoil(latitude, longitude) {
    const query = new URLSearchParams({ latitude, longitude });
    const response = await fetch(`/api/soil?${query.toString()}`, { headers: { Accept: "application/json" } });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `Soil request failed (${response.status}).`);
    return data;
  }

  function drawEmpty(canvas, message) {
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(rect.width * ratio));
    canvas.height = Math.round(205 * ratio);
    const context = canvas.getContext("2d");
    context.scale(ratio, ratio);
    context.fillStyle = "#77857a";
    context.font = "13px system-ui, sans-serif";
    context.textAlign = "center";
    context.fillText(message, rect.width / 2, 102);
  }

  function drawTemperatureChart(daily) {
    const canvas = document.querySelector("#temperature-chart");
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    const width = Math.max(1, rect.width);
    const height = 205;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    const ctx = canvas.getContext("2d");
    ctx.scale(ratio, ratio);
    const series = [
      { key: "T2M", color: "#000000" },
      { key: "T2M_MAX", color: "#3ea26e" },
      { key: "T2M_MIN", color: "#ecd856" }
    ];
    const values = daily.flatMap(day => series.map(line => day[line.key]).filter(value => value !== null && Number.isFinite(value)));
    if (!values.length) { drawEmpty(canvas, "No valid temperature measurements"); return; }
    let minimum = Math.min(...values);
    let maximum = Math.max(...values);
    if (minimum === maximum) { minimum -= 1; maximum += 1; }
    const pad = { left: 34, right: 8, top: 10, bottom: 24 };
    const plotWidth = width - pad.left - pad.right;
    const plotHeight = height - pad.top - pad.bottom;
    const y = value => pad.top + (maximum - value) / (maximum - minimum) * plotHeight;
    ctx.font = "10px system-ui, sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    for (let tick = 0; tick <= 3; tick++) {
      const value = minimum + (maximum - minimum) * tick / 3;
      const yy = pad.top + plotHeight * tick / 3;
      ctx.strokeStyle = "#e7ece5";
      ctx.beginPath(); ctx.moveTo(pad.left, yy); ctx.lineTo(width - pad.right, yy); ctx.stroke();
      ctx.fillStyle = "#829087"; ctx.fillText(value.toFixed(0), pad.left - 5, yy);
    }
    series.forEach(line => {
      ctx.strokeStyle = line.color;
      ctx.lineWidth = line.key === "T2M" ? 2.8 : 1.8;
      ctx.beginPath();
      let started = false;
      daily.forEach((day, index) => {
        const value = day[line.key];
        if (value === null || !Number.isFinite(value)) { started = false; return; }
        const x = pad.left + (daily.length < 2 ? plotWidth / 2 : index / (daily.length - 1) * plotWidth);
        if (started) ctx.lineTo(x, y(value)); else { ctx.moveTo(x, y(value)); started = true; }
      });
      ctx.stroke();
    });
    ctx.fillStyle = "#829087"; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    if (daily.length) ctx.fillText(daily[0].date, pad.left, height - 5);
    if (daily.length > 1) { ctx.textAlign = "right"; ctx.fillText(daily[daily.length - 1].date, width - pad.right, height - 5); }
  }

  function drawPrecipitationChart(daily) {
    const canvas = document.querySelector("#precipitation-chart");
    const rect = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    const width = Math.max(1, rect.width);
    const height = 205;
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    const ctx = canvas.getContext("2d");
    ctx.scale(ratio, ratio);
    const values = daily.map(day => day.PRECTOTCORR).filter(value => value !== null && Number.isFinite(value));
    if (!values.length) { drawEmpty(canvas, "No valid precipitation measurements"); return; }
    const maximum = Math.max(...values, 1);
    const pad = { left: 34, right: 8, top: 10, bottom: 24 };
    const plotWidth = width - pad.left - pad.right;
    const plotHeight = height - pad.top - pad.bottom;
    ctx.strokeStyle = "#e7ece5";
    ctx.beginPath(); ctx.moveTo(pad.left, height - pad.bottom); ctx.lineTo(width - pad.right, height - pad.bottom); ctx.stroke();
    const slot = plotWidth / Math.max(daily.length, 1);
    const barWidth = Math.max(1, Math.min(7, slot * .72));
    daily.forEach((day, index) => {
      const value = day.PRECTOTCORR;
      if (value === null || !Number.isFinite(value)) return;
      const barHeight = Math.max(1, value / maximum * plotHeight);
      const x = pad.left + index * slot + (slot - barWidth) / 2;
      ctx.fillStyle = "#255b82";
      ctx.fillRect(x, height - pad.bottom - barHeight, barWidth, barHeight);
    });
    ctx.fillStyle = "#829087"; ctx.font = "10px system-ui, sans-serif"; ctx.textAlign = "left";
    if (daily.length) ctx.fillText(daily[0].date, pad.left, height - 5);
    if (daily.length > 1) { ctx.textAlign = "right"; ctx.fillText(daily[daily.length - 1].date, width - pad.right, height - 5); }
  }

  function redrawCharts() {
    if (!lastDailyData.length) return;
    drawTemperatureChart(lastDailyData);
    drawPrecipitationChart(lastDailyData);
  }
  window.addEventListener("resize", redrawCharts);

  function renderRiskReport(data) {
    const daily = data.daily || [];
    const heatThreshold = Number(document.querySelector("#heat-threshold").value);
    const coldThreshold = Number(document.querySelector("#cold-threshold").value);

    const validHighs = daily.filter(day => Number.isFinite(day.T2M_MAX));
    const validLows = daily.filter(day => Number.isFinite(day.T2M_MIN));
    const validRain = daily.filter(day => Number.isFinite(day.PRECTOTCORR));

    const heatDays = validHighs.filter(day => day.T2M_MAX > heatThreshold).length;
    const coldDays = validLows.filter(day => day.T2M_MIN < coldThreshold).length;
    const totalRain = validRain.reduce((total, day) => total + day.PRECTOTCORR, 0);

    // A missing precipitation observation breaks the dry-stretch count.
    let currentDryStretch = 0;
    let longestDryStretch = 0;
    for (const day of daily) {
      if (Number.isFinite(day.PRECTOTCORR) && day.PRECTOTCORR < 1) {
        currentDryStretch++;
        longestDryStretch = Math.max(longestDryStretch, currentDryStretch);
      } else {
        currentDryStretch = 0;
      }
    }

    const metrics = [
      ["Days above heat threshold", `${heatDays}`, `Daily high above ${heatThreshold}°C · ${validHighs.length} valid days`],
      ["Days below cold threshold", `${coldDays}`, `Daily low below ${coldThreshold}°C · ${validLows.length} valid days`],
      ["Longest dry stretch", `${longestDryStretch} days`, "Consecutive valid days below 1 mm precipitation"],
      ["Total precipitation", `${totalRain.toFixed(1)} mm`, `${validRain.length} days with valid rainfall data`]
    ];
    const container = document.querySelector("#risk-metrics");
    container.replaceChildren();
    for (const [label, valueText, detailText] of metrics) {
      const card = document.createElement("article"); card.className = "metric";
      const name = document.createElement("div"); name.className = "metric-name"; name.textContent = label;
      const value = document.createElement("div"); value.className = "metric-value"; value.textContent = valueText;
      const detail = document.createElement("div"); detail.className = "metric-detail"; detail.textContent = detailText;
      card.append(name, value, detail); container.append(card);
    }

    const findings = [];
    if (validHighs.length) {
      findings.push(heatDays
        ? `${heatDays} of ${validHighs.length} valid days had a daily high above your selected heat screening threshold (${heatThreshold}°C). Review whether those days overlapped with sensitive crop growth stages.`
        : `No valid daily highs exceeded your selected heat screening threshold (${heatThreshold}°C) during this period.`);
    } else {
      findings.push("No valid daily maximum-temperature measurements were available, so heat-screening days could not be calculated.");
    }
    if (validLows.length) {
      findings.push(coldDays
        ? `${coldDays} of ${validLows.length} valid days had a daily low below your selected cold screening threshold (${coldThreshold}°C). Consider whether cold-sensitive crops or growth stages were present.`
        : `No valid daily lows fell below your selected cold screening threshold (${coldThreshold}°C) during this period.`);
    } else {
      findings.push("No valid daily minimum-temperature measurements were available, so cold-screening days could not be calculated.");
    }
    if (validRain.length) {
      findings.push(`The longest run of consecutive valid days with less than 1 mm of precipitation was ${longestDryStretch} day(s). Rainfall alone does not show how much irrigation was applied or how much water was available to crops.`);
    } else {
      findings.push("No valid precipitation measurements were available, so dry stretches and total precipitation could not be calculated.");
    }
    if (validHighs.length < daily.length || validLows.length < daily.length || validRain.length < daily.length) {
      findings.push("Some daily measurements were unavailable. The report shows valid-day counts so missing values are not treated as zero.");
    }

    riskFindings.replaceChildren();
    for (const finding of findings) {
      const card = document.createElement("article"); card.className = "crop-card";
      const paragraph = document.createElement("p"); paragraph.className = "reason"; paragraph.textContent = finding;
      card.append(paragraph); riskFindings.append(card);
    }
    const status = document.querySelector("#risk-status");
    status.textContent = "Report generated";
    status.className = "tag";
  }

  function renderSourceNote(data) {
    const warningText = data.warnings && data.warnings.length ? ` ${data.warnings.join(" ")}` : "";
    document.querySelector("#source-note").textContent =
      `${data.source} · ${data.location.latitude}, ${data.location.longitude} · ${data.date_range.start} to ${data.date_range.end} · Retrieved ${new Date(data.fetched_at).toLocaleString()}.${warningText}`;
    document.querySelector("#weather-description").textContent =
      `Daily environmental data summarized for ${data.date_range.start} through ${data.date_range.end}.`;
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    errorOutput.classList.remove("visible");

    const latitude = document.querySelector("#latitude").value;
    const longitude = document.querySelector("#longitude").value;
    const start = document.querySelector("#start-date").value;
    const end = document.querySelector("#end-date").value;
    const heatThreshold = document.querySelector("#heat-threshold").value;
    const coldThreshold = document.querySelector("#cold-threshold").value;

    if (start > end) {
      errorOutput.textContent = "Start date must be on or before end date.";
      errorOutput.classList.add("visible");
      return;
    }
    if (end > todayUtc || start > todayUtc) {
      errorOutput.textContent = `Dates cannot be in the future. The latest allowed date is ${todayUtc}.`;
      errorOutput.classList.add("visible");
      return;
    }
    if (!Number.isFinite(Number(heatThreshold)) || !Number.isFinite(Number(coldThreshold))) {
      errorOutput.textContent = "Enter valid numeric heat and cold thresholds.";
      errorOutput.classList.add("visible");
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Generating report…";
    const weatherStatus = document.querySelector("#weather-status");
    weatherStatus.textContent = "Fetching live data";
    weatherStatus.className = "tag warning";
    document.querySelector("#risk-status").textContent = "Generating report";
    document.querySelector("#risk-status").className = "tag warning";
    document.querySelector("#source-note").textContent = "Loading NASA POWER data for this request…";
    document.querySelector("#weather-description").textContent = "Waiting for the selected location and date range.";
    riskFindings.replaceChildren();
    const loading = document.createElement("div");
    loading.className = "empty";
    loading.textContent = "Retrieving environmental data and preparing your report…";
    riskFindings.append(loading);
    lastDailyData = [];
    renderMetrics({});
    drawEmpty(document.querySelector("#temperature-chart"), "Waiting for NASA data");
    drawEmpty(document.querySelector("#precipitation-chart"), "Waiting for NASA data");
    setCard("moisture", "Loading", "pending", [para("Retrieving modeled soil wetness from NASA POWER…")]);
    setCard("usda", "Loading", "pending", [para("Looking up USDA soil survey data for this point…")]);

    // Soil lookup runs in parallel with the NASA POWER request.
    loadSoil(latitude, longitude)
      .then(renderUsdaSoil)
      .catch(error => setCard("usda", "Unavailable", "warning", [para(error.message || "Could not retrieve USDA soil data.")]));

    try {
      const query = new URLSearchParams({ latitude, longitude, start, end });
      const response = await fetch(`/api/power?${query.toString()}`, { headers: { Accept: "application/json" } });
      const contentType = response.headers.get("content-type") || "";
      if (!contentType.includes("application/json")) {
        const body = await response.text();
        throw new Error(`The server did not return JSON (HTTP ${response.status}). ${body.slice(0, 180)}`);
      }
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || `Request failed (${response.status}).`);

      renderMetrics(data.summary);
      renderSourceNote(data);
      renderSoilMoisture(data.summary);
      lastDailyData = data.daily || [];
      redrawCharts();
      renderRiskReport(data);
      weatherStatus.textContent = "NASA data loaded";
      weatherStatus.className = "tag";
    } catch (error) {
      errorOutput.textContent = error.message || "Could not retrieve NASA POWER data. Please try again.";
      errorOutput.classList.add("visible");
      weatherStatus.textContent = "Request failed";
      weatherStatus.className = "tag warning";
      document.querySelector("#risk-status").textContent = "Report unavailable";
      document.querySelector("#risk-status").className = "tag warning";
      riskFindings.replaceChildren();
      const card = document.createElement("div"); card.className = "empty";
      card.textContent = "A risk report could not be generated because the NASA POWER request failed.";
      riskFindings.append(card);
      setCard("moisture", "Unavailable", "warning", [para("Soil wetness could not be retrieved because the NASA POWER request failed.")]);
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = "Generate Growing-Season Report";
    }
  });
</script>
